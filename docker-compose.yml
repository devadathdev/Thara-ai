services:
  postgres:
    image: postgres:17-alpine
    container_name: thara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thara
      POSTGRES_USER: thara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - thara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thara -d thara"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  thara_postgres_data:
