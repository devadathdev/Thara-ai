name: THARA V6 Checks

on:
  pull_request:
    branches: [main, upgrade/v6-model-router]
  push:
    branches: [upgrade/v6-model-router, upgrade/v6-guarded-autonomy]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused autonomy, mission and approval tests
        run: npm run test:autonomy
      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://thara:ci-placeholder-password@127.0.0.1:54329/thara?schema=public
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://thara:ci-placeholder-password@127.0.0.1:54329/thara?schema=public
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: thara-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: thara-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: thara-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:ci"
          FIREBASE_PROJECT_ID: thara-ci
          FIREBASE_CLIENT_EMAIL: ci@example.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nCI_PLACEHOLDER\n-----END PRIVATE KEY-----"
          THARA_APPROVAL_SECRET: "ci-only-secret-not-for-production-0000000000000000"
          NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
