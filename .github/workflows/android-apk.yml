name: Build THARA Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thara-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          printf '%s  %s\n' "$SHA256" "thara-ai-debug.apk" > /tmp/thara-ai-debug.apk.sha256
          if gh release view thara-android-latest >/dev/null 2>&1; then
            gh release upload thara-android-latest "$APK" /tmp/thara-ai-debug.apk.sha256 --clobber
          else
            gh release create thara-android-latest "$APK" /tmp/thara-ai-debug.apk.sha256 \
              --title "THARA AI Android — Latest" \
              --notes "Automated THARA Android companion debug APK built from main. For testing/development." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
