name: THARA Local PostgreSQL Checks

on:
  pull_request:
    branches: [main, upgrade/v6-model-router, upgrade/v6-guarded-autonomy]
  push:
    branches: [upgrade/v6-model-router, upgrade/v6-guarded-autonomy, migration/postgres-local-first]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://thara:ci-placeholder-password@127.0.0.1:54329/thara?schema=public
      THARA_APPROVAL_SECRET: ci-only-secret-not-for-production-0000000000000000
      THARA_LINE_CLEAR_SECRET: ci-only-line-clear-secret-not-for-production-000000000000
      THARA_SETUP_SECRET: ci-only-setup-secret-not-for-production-0000000000000000
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Focused autonomy, mission and approval tests
        run: npm run test:autonomy
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
