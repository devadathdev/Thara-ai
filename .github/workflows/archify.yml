name: THARA Archify

on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/**"
      - ".github/workflows/archify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout THARA
        uses: actions/checkout@v4

      - name: Checkout Archify
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          path: .archify
          ref: main

      - name: Render and validate
        run: |
          node .archify/archify/bin/archify.mjs validate architecture docs/architecture/thara.architecture.json --quality showcase --json
          mkdir -p public/archify
          node .archify/archify/bin/archify.mjs deliver architecture docs/architecture/thara.architecture.json public/archify/thara-architecture.html --quality showcase --json

      - name: Commit generated artifact
        run: |
          git config user.name "THARA Archify Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/archify/thara-architecture.html
          git diff --cached --quiet && exit 0
          git commit -m "build: render THARA architecture with Archify"
          git push
